<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobLens — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-bg">

  <div class="auth-card">

    <!-- Branding/naming -->
    <div class="auth-brand">
      <div class="brand-logo">🔭</div>
      <h1>JobLens</h1>
      <p>Track every application, stay organised.</p>
    </div>

    <!-- Login window -->
    <div id="login-pane" class="auth-pane active">
      <h2>Welcome back</h2>

      <form id="login-form" novalidate>
        <div style="display:flex;flex-direction:column;gap:.9rem">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" name="email"
                   placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="error-msg" role="alert"></p>
          <button type="submit" class="btn btn-primary auth-submit">Sign in</button>
        </div>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="#" id="show-register">Create one</a>
      </p>
    </div>

    <!-- Registration -->
    <div id="register-pane" class="auth-pane">
      <h2>Create account</h2>

      <form id="register-form" novalidate>
        <div style="display:flex;flex-direction:column;gap:.9rem">
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input id="reg-email" type="email" name="email"
                   placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input id="reg-password" type="password" name="password"
                   placeholder="min. 6 characters" autocomplete="new-password" required />
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirm password</label>
            <input id="reg-confirm" type="password" name="confirm"
                   placeholder="••••••••" autocomplete="new-password" required />
          </div>
          <p id="register-error"   class="error-msg"   role="alert"></p>
          <p id="register-success" class="success-msg" role="status"></p>
          <button type="submit" class="btn btn-primary auth-submit">Create account</button>
        </div>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="#" id="show-login">Sign in</a>
      </p>
    </div>

  </div><!-- Authorization -->

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
